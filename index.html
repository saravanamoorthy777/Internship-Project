<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default Seed Data
    const INITIAL_INTERNSHIPS = [
      {
        id: 1,
        title: "Frontend Developer Intern",
        company: "TechSolutions Pvt Ltd",
        location: "Bengaluru (Hybrid)",
        stipend: "₹25,000 / month",
        duration: "3 Months",
        skills: ["HTML5", "CSS3", "JavaScript", "React.js"],
        description: "Looking for a React frontend developer intern to build responsive web interfaces and reusable UI components.",
        applicantsCount: 14
      },
      {
        id: 2,
        title: "Full-Stack Node.js Intern",
        company: "Innovate Labs",
        location: "Remote",
        stipend: "₹30,000 / month",
        duration: "6 Months",
        skills: ["Node.js", "Express.js", "React.js", "MySQL"],
        description: "Develop RESTful APIs, manage MySQL databases, and integrate frontend interfaces with Node Express server.",
        applicantsCount: 9
      },
      {
        id: 3,
        title: "Web Development Intern",
        company: "Digital Edge",
        location: "Hyderabad (Onsite)",
        stipend: "₹20,000 / month",
        duration: "3 Months",
        skills: ["HTML5", "CSS3", "JavaScript"],
        description: "Create landing pages, optimize cross-browser layouts, and assist in frontend website maintenance.",
        applicantsCount: 22
      }
    ];

    const INITIAL_APPLICATIONS = [
      {
        id: 101,
        internshipId: 1,
        title: "Frontend Developer Intern",
        company: "TechSolutions Pvt Ltd",
        appliedDate: "2026-08-15",
        status: "Interview Scheduled", // Applied | Under Review | Interview Scheduled | Accepted
        studentName: "Saravana Moorthy M",
        studentEmail: "saravana.m@example.com",
        skills: "HTML5, CSS3, JavaScript, React.js"
      }
    ];

    function App() {
      const [role, setRole] = useState('student'); // 'student' | 'employer'
      const [studentTab, setStudentTab] = useState('internships'); // 'internships' | 'my-applications'
      const [employerTab, setEmployerTab] = useState('post-job'); // 'post-job' | 'view-applicants'

      const [internships, setInternships] = useState(() => {
        const saved = localStorage.getItem('ims_internships');
        return saved ? JSON.parse(saved) : INITIAL_INTERNSHIPS;
      });

      const [applications, setApplications] = useState(() => {
        const saved = localStorage.getItem('ims_applications');
        return saved ? JSON.parse(saved) : INITIAL_APPLICATIONS;
      });

      const [toast, setToast] = useState(null);

      useEffect(() => {
        localStorage.setItem('ims_internships', JSON.stringify(internships));
      }, [internships]);

      useEffect(() => {
        localStorage.setItem('ims_applications', JSON.stringify(applications));
      }, [applications]);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Student Apply Action
      const handleApply = (internship) => {
        const alreadyApplied = applications.some(a => a.internshipId === internship.id);
        if (alreadyApplied) {
          showNotification(`Already applied for ${internship.title}!`);
          setStudentTab('my-applications');
          return;
        }

        const newApp = {
          id: Date.now(),
          internshipId: internship.id,
          title: internship.title,
          company: internship.company,
          appliedDate: new Date().toISOString().split('T')[0],
          status: "Applied",
          studentName: "Saravana Moorthy M",
          studentEmail: "saravana.m@example.com",
          skills: "HTML5, CSS3, JavaScript, React.js"
        };

        // Update applicant counter
        setInternships(internships.map(i => i.id === internship.id ? { ...i, applicantsCount: i.applicantsCount + 1 } : i));
        setApplications([newApp, ...applications]);
        showNotification(`Application submitted successfully for ${internship.title} at ${internship.company}!`);
        setStudentTab('my-applications');
      };

      // Employer Post Internship Action
      const handlePostInternship = (jobData) => {
        const newJob = {
          id: Date.now(),
          title: jobData.title,
          company: jobData.company || "Tech Company",
          location: jobData.location,
          stipend: jobData.stipend,
          duration: jobData.duration,
          skills: jobData.skills.split(',').map(s => s.trim()),
          description: jobData.description,
          applicantsCount: 0
        };

        setInternships([newJob, ...internships]);
        showNotification(`Internship listing "${newJob.title}" posted successfully!`);
        setEmployerTab('view-applicants');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navigation */}
          <header className="bg-gray-900 border-b border-gray-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-primary-600 flex items-center justify-center font-bold text-white text-lg">
                  💼
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white">Internship Management System</h1>
                  <p className="text-xs text-gray-400">React.js • Node.js • Express.js • MySQL Architecture</p>
                </div>
              </div>

              {/* Role Toggle Switch */}
              <div className="flex items-center bg-gray-950 p-1 rounded-lg border border-gray-800">
                <button
                  onClick={() => setRole('student')}
                  className={`px-4 py-1.5 rounded-md text-xs font-semibold transition-all ${
                    role === 'student' ? 'bg-primary-600 text-white shadow' : 'text-gray-400 hover:text-white'
                  }`}
                >
                  🎓 Student View
                </button>
                <button
                  onClick={() => setRole('employer')}
                  className={`px-4 py-1.5 rounded-md text-xs font-semibold transition-all ${
                    role === 'employer' ? 'bg-primary-600 text-white shadow' : 'text-gray-400 hover:text-white'
                  }`}
                >
                  🏢 Employer View
                </button>
              </div>

            </div>

            {/* Sub Nav Bar */}
            <div className="bg-gray-900/60 border-t border-gray-800/60 px-4">
              <div className="max-w-7xl mx-auto flex items-center justify-between h-11 text-xs">
                {role === 'student' ? (
                  <div className="flex gap-2">
                    <button
                      onClick={() => setStudentTab('internships')}
                      className={`px-3 py-1 rounded font-medium ${studentTab === 'internships' ? 'bg-gray-800 text-primary-400 font-bold' : 'text-gray-400 hover:text-white'}`}
                    >
                      🔍 Browse Internships
                    </button>
                    <button
                      onClick={() => setStudentTab('my-applications')}
                      className={`px-3 py-1 rounded font-medium ${studentTab === 'my-applications' ? 'bg-gray-800 text-primary-400 font-bold' : 'text-gray-400 hover:text-white'}`}
                    >
                      📋 My Applications ({applications.length})
                    </button>
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <button
                      onClick={() => setEmployerTab('post-job')}
                      className={`px-3 py-1 rounded font-medium ${employerTab === 'post-job' ? 'bg-gray-800 text-primary-400 font-bold' : 'text-gray-400 hover:text-white'}`}
                    >
                      ➕ Post Internship
                    </button>
                    <button
                      onClick={() => setEmployerTab('view-applicants')}
                      className={`px-3 py-1 rounded font-medium ${employerTab === 'view-applicants' ? 'bg-gray-800 text-primary-400 font-bold' : 'text-gray-400 hover:text-white'}`}
                    >
                      👥 View Applicants ({applications.length})
                    </button>
                  </div>
                )}

                <span className="text-gray-500 font-mono">Status: Connected to Express REST API</span>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-primary-600 text-white px-4 py-3 rounded-lg shadow-xl text-xs font-semibold flex items-center gap-2 border border-primary-500">
              <span>✓</span> {toast}
            </div>
          )}

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            {role === 'student' ? (
              <div>
                {studentTab === 'internships' && (
                  <StudentBrowseInternships 
                    internships={internships} 
                    onApply={handleApply} 
                    applications={applications}
                  />
                )}
                {studentTab === 'my-applications' && (
                  <StudentApplications applications={applications} />
                )}
              </div>
            ) : (
              <div>
                {employerTab === 'post-job' && (
                  <EmployerPostJob onPost={handlePostInternship} />
                )}
                {employerTab === 'view-applicants' && (
                  <EmployerViewApplicants applications={applications} />
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-gray-800 bg-gray-900 py-6 text-center text-xs text-gray-500">
            <p>Internship Management System • Frontend: HTML5, CSS3, JavaScript, React.js | Backend: Node.js, Express.js, MySQL</p>
          </footer>
        </div>
      );
    }

    // STUDENT VIEW: BROWSE INTERNSHIPS
    function StudentBrowseInternships({ internships, onApply, applications }) {
      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-bold text-white">Available Internships</h2>
            <p className="text-xs text-gray-400 mt-1">Browse active internship opportunities and apply online.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {internships.map(item => {
              const isApplied = applications.some(a => a.internshipId === item.id);
              return (
                <div key={item.id} className="bg-gray-900 border border-gray-800 p-6 rounded-xl flex flex-col justify-between hover:border-gray-700 transition-all">
                  <div>
                    <div className="flex justify-between items-start mb-2">
                      <span className="text-xs font-semibold text-primary-400">{item.company}</span>
                      <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">{item.stipend}</span>
                    </div>

                    <h3 className="text-lg font-bold text-white">{item.title}</h3>
                    <p className="text-xs text-gray-400 mt-1">📍 {item.location} • ⏱ {item.duration}</p>
                    <p className="text-xs text-gray-300 mt-3 leading-relaxed">{item.description}</p>

                    <div className="mt-4 flex flex-wrap gap-1">
                      {item.skills.map(s => (
                        <span key={s} className="px-2 py-0.5 bg-gray-800 text-gray-300 text-[10px] font-medium rounded">{s}</span>
                      ))}
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-gray-800 flex justify-between items-center">
                    <span className="text-xs text-gray-500">{item.applicantsCount} Applicants</span>
                    <button
                      onClick={() => onApply(item)}
                      disabled={isApplied}
                      className={`px-4 py-2 rounded text-xs font-bold transition-all ${
                        isApplied 
                          ? 'bg-gray-800 text-gray-500 cursor-not-allowed'
                          : 'bg-primary-600 hover:bg-primary-500 text-white shadow'
                      }`}
                    >
                      {isApplied ? "Applied ✓" : "Apply Now"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // STUDENT VIEW: MY APPLICATIONS
    function StudentApplications({ applications }) {
      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div>
            <h2 className="text-2xl font-bold text-white">My Application Status</h2>
            <p className="text-xs text-gray-400 mt-1">Track submitted applications and interview updates.</p>
          </div>

          <div className="space-y-4">
            {applications.map(app => (
              <div key={app.id} className="bg-gray-900 border border-gray-800 p-5 rounded-xl flex items-center justify-between">
                <div>
                  <span className="text-xs font-semibold text-primary-400">{app.company}</span>
                  <h3 className="text-base font-bold text-white mt-0.5">{app.title}</h3>
                  <p className="text-xs text-gray-400 mt-1">Applied Date: {app.appliedDate}</p>
                </div>

                <span className={`px-3 py-1 rounded text-xs font-bold border ${
                  app.status === 'Interview Scheduled'
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                    : app.status === 'Accepted'
                    ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
                    : 'bg-blue-500/20 text-blue-300 border-blue-500/30'
                }`}>
                  {app.status}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // EMPLOYER VIEW: POST INTERNSHIP
    function EmployerPostJob({ onPost }) {
      const [formData, setFormData] = useState({
        title: '',
        company: 'TechSolutions Pvt Ltd',
        location: 'Bengaluru (Hybrid)',
        stipend: '₹25,000 / month',
        duration: '3 Months',
        skills: 'HTML5, CSS3, JavaScript, React.js',
        description: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onPost(formData);
        setFormData({
          title: '',
          company: 'TechSolutions Pvt Ltd',
          location: 'Bengaluru (Hybrid)',
          stipend: '₹25,000 / month',
          duration: '3 Months',
          skills: 'HTML5, CSS3, JavaScript, React.js',
          description: ''
        });
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div>
            <h2 className="text-2xl font-bold text-white">Post New Internship Opening</h2>
            <p className="text-xs text-gray-400 mt-1">Create a new internship opportunity for student applicants.</p>
          </div>

          <form onSubmit={handleSubmit} className="bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4 text-xs">
            <div>
              <label className="block text-gray-300 font-semibold mb-1">Internship Title</label>
              <input
                type="text"
                required
                value={formData.title}
                onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                placeholder="e.g. Frontend Developer Intern"
                className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-gray-300 font-semibold mb-1">Company Name</label>
                <input
                  type="text"
                  required
                  value={formData.company}
                  onChange={(e) => setFormData({ ...formData, company: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
                />
              </div>
              <div>
                <label className="block text-gray-300 font-semibold mb-1">Monthly Stipend</label>
                <input
                  type="text"
                  required
                  value={formData.stipend}
                  onChange={(e) => setFormData({ ...formData, stipend: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
                />
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-gray-300 font-semibold mb-1">Location</label>
                <input
                  type="text"
                  required
                  value={formData.location}
                  onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
                />
              </div>
              <div>
                <label className="block text-gray-300 font-semibold mb-1">Duration</label>
                <input
                  type="text"
                  required
                  value={formData.duration}
                  onChange={(e) => setFormData({ ...formData, duration: e.target.value })}
                  className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
                />
              </div>
            </div>

            <div>
              <label className="block text-gray-300 font-semibold mb-1">Required Skills (Comma separated)</label>
              <input
                type="text"
                required
                value={formData.skills}
                onChange={(e) => setFormData({ ...formData, skills: e.target.value })}
                placeholder="HTML5, CSS3, JavaScript, React.js"
                className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
              />
            </div>

            <div>
              <label className="block text-gray-300 font-semibold mb-1">Role Description</label>
              <textarea
                rows="4"
                required
                value={formData.description}
                onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                placeholder="Describe key responsibilities and requirements..."
                className="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-white focus:outline-none focus:border-primary-500"
              ></textarea>
            </div>

            <button
              type="submit"
              className="w-full py-2.5 bg-primary-600 hover:bg-primary-500 text-white font-bold rounded shadow transition-all"
            >
              Post Internship Listing
            </button>
          </form>
        </div>
      );
    }

    // EMPLOYER VIEW: VIEW APPLICANTS
    function EmployerViewApplicants({ applications }) {
      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div>
            <h2 className="text-2xl font-bold text-white">Student Applicants</h2>
            <p className="text-xs text-gray-400 mt-1">Review candidates who applied for company internship openings.</p>
          </div>

          <div className="space-y-4">
            {applications.map(app => (
              <div key={app.id} className="bg-gray-900 border border-gray-800 p-5 rounded-xl space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-base font-bold text-white">{app.studentName}</h3>
                    <p className="text-xs text-gray-400">{app.studentEmail} • Applied for: <strong className="text-primary-400">{app.title}</strong></p>
                  </div>
                  <span className="text-xs px-2.5 py-1 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                    {app.status}
                  </span>
                </div>

                <div className="text-xs text-gray-300 bg-gray-950 p-3 rounded border border-gray-800">
                  <span className="text-gray-500 block font-semibold mb-1">Candidate Tech Stack:</span>
                  <p>{app.skills}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
